<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | DEVSPHERE LMS</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<link rel="stylesheet" href="register.css">

</head>


<body>


<div class="background">


<div class="circle c1"></div>

<div class="circle c2"></div>

</div>




<div class="register-container">


<form class="register-box" id="registerForm">


<div class="logo">

<i class="fas fa-user-plus"></i>

</div>


<h2>Create Account</h2>

<p>
Join DEVSPHERE Library System
</p>



<div class="row">


<div class="input-group">


<label>
Full Name
</label>


<div class="input-box">

<i class="fas fa-user"></i>

<input 
type="text"
placeholder="Enter full name"
required>

</div>


</div>




<div class="input-group">


<label>
Registration Number
</label>


<div class="input-box">

<i class="fas fa-id-card"></i>

<input 
type="text"
placeholder="UICT/2026/0001"
required>

</div>


</div>


</div>




<div class="row">


<div class="input-group">


<label>
Email
</label>


<div class="input-box">


<i class="fas fa-envelope"></i>


<input 
type="email"
placeholder="example@gmail.com"
required>


</div>


</div>



<div class="input-group">


<label>
Phone Number
</label>


<div class="input-box">


<i class="fas fa-phone"></i>


<input 
type="tel"
placeholder="0789958889"
required>


</div>


</div>


</div>





<div class="input-group">


<label>
Course
</label>


<div class="input-box">


<i class="fas fa-graduation-cap"></i>


<select>


<option>
Select Course
</option>


<option>
Diploma in Software Engineering
</option>


<option>
Diploma in ICT
</option>


<option>
Diploma in Electrical Engineering
</option>


</select>


</div>


</div>






<div class="row">


<div class="input-group">


<label>
Password
</label>


<div class="input-box">


<i class="fas fa-lock"></i>


<input 
type="password"
placeholder="Password">


</div>


</div>





<div class="input-group">


<label>
Confirm Password
</label>


<div class="input-box">


<i class="fas fa-lock"></i>


<input 
type="password"
placeholder="Confirm Password">



</div>


</div>


</div>




<button class="register-btn">

Register

</button>



<p class="login-link">

Already have an account?

<a href="login.html">
Login
</a>

</p>



<a href="landingpage.html" class="back">

<i class="fas fa-arrow-left"></i>

Back Home

</a>



</form>


</div>


</body>

</html>
