<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | DEVSPHERE LMS</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="background">

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

</div>

<div class="container">

<div class="left">

<div class="overlay"></div>

<div class="content">

<h1>

DEVSPHERE

</h1>

<h2>

Library Management System

</h2>

<p>

Manage books, students,
borrowing, returns,
notifications and reports
from anywhere.

</p>

<div class="features">

<div>

<i class="fas fa-book"></i>

<span>Book Management</span>

</div>

<div>

<i class="fas fa-user-graduate"></i>

<span>Student Management</span>

</div>

<div>

<i class="fas fa-right-left"></i>

<span>Borrow & Return</span>

</div>

<div>

<i class="fas fa-chart-line"></i>

<span>Reports</span>

</div>

</div>

</div>

</div>

<div class="right">

<form id="loginForm">

<div class="logo">

<i class="fas fa-book-open-reader"></i>

</div>

<h2>

Welcome Back

</h2>

<p>

Sign in to continue

</p>

<div class="input-group">

<label>

Registration Number

</label>

<div class="input-box">

<i class="fas fa-id-card"></i>

<input
type="text"
id="regno"
placeholder="e.g. UICT/2026/001"
required>

</div>

<small id="regError"></small>

</div>

<div class="input-group">

<label>

Password

</label>

<div class="input-box">

<i class="fas fa-lock"></i>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

<i
class="fas fa-eye"
id="togglePassword">

</i>

</div>

<small id="passError"></small>

</div>

<div class="options">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="forgot-password.html">

Forgot Password?

</a>

</div>

<button
type="submit"
class="login-btn" > 

Login

</button>

<div class="divider">

<span>

OR

</span>

</div>

<button
type="button"
class="google-btn">

<i class="fab fa-google"></i>

Continue with Google

</button>

<p class="register">

Don't have an account?

<a href="register.html">

Register

</a>

</p>

<a
href="landingpage.html"
class="back">

<i class="fas fa-arrow-left"></i>

Back Home

</a>

</form>

</div>

</div>

<div id="toast"></div>

<script src="login.js"></script>

</body>
</html>
