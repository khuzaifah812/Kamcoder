<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420" aria-label="Profile photo placeholder for Khuzaifah Aine Mbabazi">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#252540"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="figureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6c63ff" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="200" cy="210" r="195"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="420" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(108,99,255,0.06)" stroke-width="1"/>
  </pattern>
  <rect width="400" height="420" fill="url(#grid)"/>

  <!-- Glow orb top-left -->
  <circle cx="60" cy="60" r="120" fill="rgba(108,99,255,0.08)" filter="url(#blur)"/>
  <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>

  <!-- Person silhouette — head -->
  <circle cx="200" cy="155" r="68" fill="url(#figureGrad)"/>

  <!-- Person silhouette — shoulders/body -->
  <ellipse cx="200" cy="330" rx="115" ry="90" fill="url(#figureGrad)"/>

  <!-- Monogram initials -->
  <text
    x="200" y="175"
    font-family="'Inter', 'Segoe UI', sans-serif"
    font-size="52"
    font-weight="800"
    fill="white"
    fill-opacity="0.85"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-2"
  >KAM</text>

  <!-- Bottom label -->
  <rect x="60" y="372" width="280" height="34" rx="8" fill="rgba(108,99,255,0.15)" stroke="rgba(108,99,255,0.3)" stroke-width="1"/>
  <text
    x="200" y="393"
    font-family="'Inter', 'Segoe UI', sans-serif"
    font-size="11"
    font-weight="600"
    fill="rgba(255,255,255,0.6)"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="1.5"
  >ADD PROFILE PHOTO HERE</text>
</svg>
